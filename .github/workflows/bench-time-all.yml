name: bench-time-all

# Ad-hoc perf check for scripts/bench_time_all.jac: runs every public
# time endpoint on all three lanes (native bundled na_stdlib, python
# bridge, CPython oracle) on a hosted runner. Dispatch only -- not part
# of PR CI. The oracle source is generated here because the repo blocks
# new .py files in PRs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Materialize vendored runtimes
        working-directory: jac
        run: |
          set -euxo pipefail
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Run bench (native lane)
        working-directory: jac
        env:
          JAC_DEV_SOURCE: ${{ github.workspace }}/jac
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          {
            echo "### bench_time_all -- ns/iter (${{ runner.os }} / ${{ runner.arch }}, $(nproc) vcpu)"
            echo
            echo '#### lane: jac run -b native (bundled na_stdlib/time)'
            echo '```'
            "$BIN" run -b native ../scripts/bench_time_all.jac
            echo '```'
          } | tee bench-na.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run bench (python bridge lane)
        working-directory: jac
        env:
          JAC_DEV_SOURCE: ${{ github.workspace }}/jac
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          {
            echo '#### lane: jac run -b python (CPython time via bridge)'
            echo '```'
            "$BIN" run -b python ../scripts/bench_time_all.jac
            echo '```'
          } | tee bench-sv.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write CPython oracle twin
        run: |
          cat > /tmp/bench_time_all.py <<'PYEOF'
          import time

          N = 500000
          NSLEEP0 = 20000
          NSLEEP = 2000
          NERR = 10000
          REPS = 3


          def main():
              acc = 0

              i = 0
              while i < 1000:
                  acc += time.monotonic_ns() % 65536
                  acc += time.time_ns() % 65536
                  acc += time.perf_counter_ns() % 65536
                  acc += time.process_time_ns() % 65536
                  acc += time.thread_time_ns() % 65536
                  acc += time.clock_gettime_ns(time.CLOCK_MONOTONIC) % 65536
                  acc += int(time.time() * 1000000.0) % 65536
                  acc += int(time.monotonic() * 1000000.0) % 65536
                  acc += int(time.perf_counter() * 1000000.0) % 65536
                  acc += int(time.process_time() * 1000000.0) % 65536
                  acc += int(time.thread_time() * 1000000.0) % 65536
                  time.sleep(0.0)
                  i += 1

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += i % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("bare_loop", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += int(time.time() * 1000000.0) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("time", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.time_ns() % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("time_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += int(time.monotonic() * 1000000.0) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("monotonic", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.monotonic_ns() % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("monotonic_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += int(time.perf_counter() * 1000000.0) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("perf_counter", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.perf_counter_ns() % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("perf_counter_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += int(time.process_time() * 1000000.0) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("process_time", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.process_time_ns() % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("process_time_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += int(time.thread_time() * 1000000.0) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("thread_time", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.thread_time_ns() % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("thread_time_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < N:
                      acc += time.clock_gettime_ns(time.CLOCK_MONOTONIC) % 65536
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("clock_gettime_ns", best / N, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < NERR:
                      try:
                          time.clock_settime_ns(time.CLOCK_MONOTONIC, 0)
                      except Exception:
                          acc += 1
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("clock_settime_ns_err", best / NERR, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < NSLEEP0:
                      time.sleep(0.0)
                      acc += 1
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("sleep_0", best / NSLEEP0, "acc:", acc)

              best = -1
              for _ in range(REPS):
                  i = 0
                  t0 = time.monotonic_ns()
                  while i < NSLEEP:
                      time.sleep(0.0001)
                      acc += 1
                      i += 1
                  dt = time.monotonic_ns() - t0
                  if best < 0 or dt < best:
                      best = dt
              print("sleep_100us", best / NSLEEP, "acc:", acc)


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Run bench (CPython oracle lane)
        run: |
          set -euo pipefail
          {
            echo "#### lane: python3 $(python3 --version 2>&1) (CPython oracle)"
            echo '```'
            python3 /tmp/bench_time_all.py
            echo '```'
          } | tee jac/bench-py.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-time-all
          path: jac/bench-*.txt
          if-no-files-found: error
