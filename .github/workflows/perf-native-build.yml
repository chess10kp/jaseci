name: perf-native-build

# Throwaway perf instrumentation: runs `jac build --native` under
# JAC_BUILD_TIMING (see cli/commands/impl/native_build.impl.jac) on a GitHub
# runner and records per-stage wall time for the chess app and a small
# kernel. Push-triggered on this branch only when the instrumentation or this
# file changes; never lands on main.

on:
  push:
    branches: ["schedule-passes", "perf-native/**"]
    paths:
      - ".github/workflows/perf-native-build.yml"
      - "jac/jaclang/cli/commands/impl/native_build.impl.jac"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Measured builds per source"
        default: "3"
      memory:
        description: "Memory profile"
        default: "managed"
        type: choice
        options: ["managed", "rc", "nogc"]

permissions:
  contents: read

env:
  MAIN_SRC: examples/chess/chess.jac
  KERNEL_SRC: examples/ownbench/kernels/own_vecdot.jac

jobs:
  timing:
    name: native build timing
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Restore cached jac binary
        id: bincache
        uses: actions/cache/restore@v4
        with:
          path: jac/zig-out/bin/jac
          key: bench-jac-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig', 'jac/build.zig.zon', 'jac/jaclang/**', 'jac/bootstrap/**', 'jac/native/**') }}

      - uses: mlugg/setup-zig@v2
        if: steps.bincache.outputs.cache-hit != 'true'
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore LLVM tree
        if: steps.bincache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: jac/.llvm-build
          key: llvm-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json') }}

      - name: Build jac
        if: steps.bincache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          JACPYTHON: "1"
        run: |
          set -euxo pipefail
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all
          zig build fetch-typeshed --summary all
          zig build -Dtarget=x86_64-linux-gnu.2.17 --summary all

      - name: Save jac binary
        if: steps.bincache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jac/zig-out/bin/jac
          key: bench-jac-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig', 'jac/build.zig.zon', 'jac/jaclang/**', 'jac/bootstrap/**', 'jac/native/**') }}

      - name: Runner info
        run: |
          nproc
          lscpu | grep -E "Model name|MHz" || true
          free -h | head -2

      - name: Run instrumented native builds
        working-directory: jac
        env:
          ROUNDS: ${{ github.event.inputs.rounds || '3' }}
          MEMORY: ${{ github.event.inputs.memory || 'managed' }}
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          OUT="$PWD/perf-out"
          mkdir -p "$OUT"
          "$BIN" --version
          build_one() {
            src="$1"; tag="$2"; i="$3"
            echo "=== build $tag round $i: $src"
            /usr/bin/time -f "WALL $tag $i %e s  maxrss %M KB" \
              -o "$OUT/wall.log" --append \
              env JAC_BUILD_TIMING="$OUT/$tag.$i.jsonl" \
              "$BIN" build "$src" --native --memory "$MEMORY" -o "$OUT/$tag-bin-$i"
          }
          for i in $(seq 1 "$ROUNDS"); do
            build_one "$MAIN_SRC" main "$i"
          done
          for i in $(seq 1 "$ROUNDS"); do
            build_one "$KERNEL_SRC" kernel "$i"
          done
          echo "=== wall times"
          cat "$OUT/wall.log"

      - name: Summarize timings
        if: always()
        working-directory: jac
        run: |
          python3 - <<'PY' | tee perf-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          rows = []
          for f in sorted(glob.glob('perf-out/*.jsonl')):
              for line in open(f):
                  line = line.strip()
                  if line.startswith('JAC_BUILD_TIMING '):
                      line = line[len('JAC_BUILD_TIMING '):]
                  if not line:
                      continue
                  rows.append((os.path.basename(f), json.loads(line)))
          stage_names = sorted({s for _, d in rows for s in d['stages']})
          print('| build | wall | ' + ' | '.join(stage_names) + ' |')
          print('|---' * (len(stage_names) + 2) + '|')
          for f, d in rows:
              cells = [f"{d['stages'].get(s, 0):.2f}" for s in stage_names]
              print(f"| {f} | {d['wall_seconds']:.2f} | " + ' | '.join(cells) + ' |')
          for f, d in rows:
              phases = d.get('phases') or {}
              passes = d.get('passes') or {}
              print(f"\n#### {f} ({d['source']}, {d['memory']})")
              if phases:
                  print('phases: ' + ', '.join(f"{k}={v:.2f}s" for k, v in sorted(phases.items(), key=lambda kv: -kv[1])))
              if passes:
                  print('top passes: ' + ', '.join(f"{k}={v:.2f}s" for k, v in list(passes.items())[:10]))
          PY
          if [ -f perf-out/wall.log ]; then
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-out/wall.log >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-timing
          path: jac/perf-out/
          if-no-files-found: warn
