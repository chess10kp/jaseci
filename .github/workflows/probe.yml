name: probe
on:
  push:
    branches: [ci-fork/na-socket]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download kit artifacts via REST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "CI")][0].id // empty')
          [ -n "$RUN_ID" ] || { echo "::error::no successful CI run to pull the kit from"; exit 1; }
          for art in jac-kit jac-precompiled; do
            URL=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$art\" and (.expired | not))][0].archive_download_url // empty")
            [ -n "$URL" ] || { echo "::error::$art artifact missing or expired on run $RUN_ID"; exit 1; }
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$URL" -o "/tmp/$art.zip"
          done
          mkdir -p jac jac/jaclang/_precompiled
          cd jac && unzip -oq /tmp/jac-kit.zip && cd ..
          cd jac/jaclang/_precompiled && unzip -oq /tmp/jac-precompiled.zip && cd ../../..
      - name: Run probes
        run: |
          chmod +x jac/zig-out/bin/jac
          rm -f jac/jaclang/_precompiled/MANIFEST.json
          python3 scripts/probe/loopback.py 8123 &
          sleep 1
          cd jac
          rm -f /tmp/dbg_*
          for p in read all10; do
            echo "=== probe: $p ==="
            ./zig-out/bin/jac run -b native ../scripts/probe/probe_$p.jac 2>&1 || echo "PROBE $p FAILED: $?"
          done
          echo "=== markers ==="
          for f in /tmp/dbg_*; do if [ -f "$f" ]; then echo "$f: $(cat "$f")"; fi; done
