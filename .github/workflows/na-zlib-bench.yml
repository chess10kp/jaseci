# One-off benchmark lane for the native zlib/gzip inflate-arena changes.
# Runs on pushes to bench/** branches on the fork; not part of PR CI.
name: na-zlib-gzip bench

on:
  push:
    branches:
      - 'bench/**'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Ensure the LLVMPY shim is present
        working-directory: jac
        run: |
          set -euo pipefail
          if ls jaclang/compiler/backends/native/llvm/libjacllvm.* >/dev/null 2>&1; then
            exit 0
          fi
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all

      - name: Materialize typeshed + vendored runtimes
        working-directory: jac
        env:
          JACPYTHON: "1"
        run: |
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Run benchmarks
        run: |
          set -o pipefail
          {
            echo "runner: $(uname -a)"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) x$(nproc)"
            echo "sha: $(git rev-parse HEAD)"
            echo
            echo "=== lane: python (CPython bridge) ==="
            jac/zig-out/bin/jac run -b python scripts/bench_zlib_gzip.jac
            echo
            echo "=== lane: native (na_stdlib) ==="
            jac/zig-out/bin/jac run -b native scripts/bench_zlib_gzip.jac
            echo
            echo "=== lane: raw libz FFI floor (native) ==="
            jac/zig-out/bin/jac run -b native scripts/bench_zlib_ffi_probe.jac
          } 2>&1 | tee bench-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-zlib-bench-results
          path: bench-results.txt
          if-no-files-found: warn
