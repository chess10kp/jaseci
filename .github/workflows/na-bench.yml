# One-off benchmark lane for the bundled string/re/reprlib modules.
# Runs on pushes to bench/** branches on the fork; not part of PR CI.
name: na-stdlib bench

on:
  push:
    branches:
      - 'bench/**'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          # Same as build-kit: the zig build steps below run through the
          # source-built interpreter, which needs the shim tree restored.
          need-build-inputs: "true"

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Ensure the LLVMPY shim is present
        working-directory: jac
        run: |
          set -euo pipefail
          if ls jaclang/compiler/backends/native/llvm/libjacllvm.* >/dev/null 2>&1; then
            exit 0
          fi
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all

      - name: Materialize typeshed + vendored runtimes
        working-directory: jac
        env:
          JACPYTHON: "1"
        run: |
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Run benchmarks
        run: |
          set -o pipefail
          bash scripts/bench/run_na_pr_bench.sh 2>&1 | tee bench-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-bench-results
          path: bench-results.txt
          if-no-files-found: warn
