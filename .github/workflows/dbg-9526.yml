name: Debug 9526 tuple-slices segv

on:
  push:
    branches: [dbg-9526]

jobs:
  build-kit:
    # The kit seals the native compiler kernel. A cold kernel build (a new
    # stage-0 pin or a units-cache miss) lowers the analysis zone in one
    # process and peaks near 15 GB, which starves a 4-vCPU runner.
    runs-on: ubuntu-latest
    env:
      # A pull request's kit links the stage-0 kernel from cached unit objects
      # instead of re-optimizing it as one program, so a kernel-touching PR
      # relinks in seconds. Main, release and nightly kits keep the bitcode
      # link: the seal honors this only for pull_request events, and the kit's
      # manifest records the mode for the runtime to check.
      JAC_PR_KIT_KERNEL_LINK: ${{ github.event_name == 'pull_request' && 'objects' || '' }}
      # A pull request reuses a JacPython whose lowered sources are unchanged.
      # Every step that runs build_python needs it, not only the jac binary
      # build: the vendor step's zig build depends on the runtime too, and
      # without it rebuilt JacPython from scratch after the kit was built.
      JAC_JACPYTHON_REUSE: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      # The kernel's stage-0 compiler, as jac/bootstrap/stage0.json pins it.
      # Under "self" every stage-0 step is skipped and the seal builds the
      # kernel with this checkout's compiler. A pinned commit builds it inside
      # the seal from that commit's jaclang snapshot: the snapshot (immutable
      # per commit) and the units stage 0 lowered come back from the cache,
      # and the seal finds the pin, the git history and the cache through
      # JAC_STAGE0_ROOT and JAC_CACHE_HOME, which precompile_env passes on.
      - name: Resolve the stage-0 pin
        id: stage0
        run: |
          set -euo pipefail
          bash scripts/ci_cache_keys.sh | grep '^stage0=' >> "$GITHUB_OUTPUT"
          echo "python=$(jq -r '.cpython.version' jac/bootstrap/python/sources.json | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "cache_home=$RUNNER_TEMP/jac-stage0-cache" >> "$GITHUB_OUTPUT"

      - name: Restore the stage-0 snapshot
        id: stage0-src
        if: steps.stage0.outputs.stage0 != 'self'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.stage0.outputs.cache_home }}/stage0/${{ steps.stage0.outputs.stage0 }}
          key: stage0-src-${{ steps.stage0.outputs.stage0 }}

      - name: Restore the stage-0 kernel units
        id: stage0-units
        if: steps.stage0.outputs.stage0 != 'self'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.stage0.outputs.cache_home }}/jir/modules
            ${{ steps.stage0.outputs.cache_home }}/jir/stage0-kernel/out
            ${{ steps.stage0.outputs.cache_home }}/jir/stubcat
            ${{ steps.stage0.outputs.cache_home }}/jir/bootstrap
          key: stage0-units-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.stage0.outputs.stage0 }}-py${{ steps.stage0.outputs.python }}-${{ github.run_id }}
          restore-keys: |
            stage0-units-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.stage0.outputs.stage0 }}-py${{ steps.stage0.outputs.python }}-

      # The checkout is shallow; the seal's guards read the pinned commit's
      # trees, so fetch that one commit.
      - name: Provision stage 0
        if: steps.stage0.outputs.stage0 != 'self'
        env:
          STAGE0_COMMIT: ${{ steps.stage0.outputs.stage0 }}
          STAGE0_CACHE: ${{ steps.stage0.outputs.cache_home }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$STAGE0_COMMIT"
          mkdir -p "$STAGE0_CACHE/jir/modules" "$STAGE0_CACHE/jir/stage0-kernel/out" \
            "$STAGE0_CACHE/jir/stubcat" "$STAGE0_CACHE/jir/bootstrap"
          touch "$RUNNER_TEMP/stage0.before"
          {
            echo "JAC_CACHE_HOME=$STAGE0_CACHE"
            echo "JAC_STAGE0_ROOT=$GITHUB_WORKSPACE/jac"
          } >> "$GITHUB_ENV"

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          # This job runs `zig build` steps below, which go through the
          # source-built interpreter and its native compiler object. A binary
          # cache hit skips producing both, so ask for them explicitly.
          need-build-inputs: "true"

      # Only main (a push or a manual dispatch) seeds the stage-0 caches, and only
      # with what this run made:
      # a binary cache hit or a fallback to the self build leaves nothing new.
      - name: Check the stage-0 products
        id: stage0-made
        if: steps.stage0.outputs.stage0 != 'self'
        env:
          STAGE0_COMMIT: ${{ steps.stage0.outputs.stage0 }}
          STAGE0_CACHE: ${{ steps.stage0.outputs.cache_home }}
        run: |
          set -euo pipefail
          src=false; units=false
          [ -f "$STAGE0_CACHE/stage0/$STAGE0_COMMIT/.stage0.json" ] && src=true
          if [ -n "$(find "$STAGE0_CACHE/jir/modules" "$STAGE0_CACHE/jir/stage0-kernel/out" \
            "$STAGE0_CACHE/jir/stubcat" "$STAGE0_CACHE/jir/bootstrap" -newer "$RUNNER_TEMP/stage0.before" -type f -print -quit)" ]; then
            units=true
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "units=$units" >> "$GITHUB_OUTPUT"

      - name: Save the stage-0 snapshot (main only)
        if: >-
          steps.stage0.outputs.stage0 != 'self' &&
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.stage0-src.outputs.cache-hit != 'true' &&
          steps.stage0-made.outputs.src == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.stage0.outputs.cache_home }}/stage0/${{ steps.stage0.outputs.stage0 }}
          key: stage0-src-${{ steps.stage0.outputs.stage0 }}

      - name: Save the stage-0 kernel units (main only)
        if: >-
          steps.stage0.outputs.stage0 != 'self' &&
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.stage0-made.outputs.units == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.stage0.outputs.cache_home }}/jir/modules
            ${{ steps.stage0.outputs.cache_home }}/jir/stage0-kernel/out
            ${{ steps.stage0.outputs.cache_home }}/jir/stubcat
            ${{ steps.stage0.outputs.cache_home }}/jir/bootstrap
          key: stage0-units-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.stage0.outputs.stage0 }}-py${{ steps.stage0.outputs.python }}-${{ github.run_id }}

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      # Both restores above can miss independently of the binary cache, and the
      # steps below cannot build the shim themselves (they only consume it).
      - name: Ensure the LLVMPY shim is present
        working-directory: jac
        run: |
          set -euo pipefail
          if ls jaclang/compiler/backends/native/llvm/libjacllvm.* >/dev/null 2>&1; then
            exit 0
          fi
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all

      # Explicit: a binary-cache hit skips zig build, so these gitignored
      # trees must be materialized either way. The wasm floor is in this list
      # for the same reason as the rest: a full build writes it as a side effect, a
      # cache hit does not, so leaving it implicit made the kit's contents a
      # function of cache state -- present on a miss, missing on a hit, with
      # if-no-files-found blind to it because the other paths matched.
      - name: Materialize typeshed + vendored runtimes
        working-directory: jac
        env:
          JACPYTHON: "1"
        run: |
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all
          zig build vendor-musl-linux-aarch64 --summary all
          zig build vendor-wasm-libc --summary all

      - name: Hermeticity + smoke (no system Python)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          ldd "$BIN" || true
          ! ldd "$BIN" | grep -qi python
          JAC_NO_DEV_SOURCE=1 "$BIN" -c 'import ctypes; assert ctypes.pythonapi._PyJac_CompilerRequired() == 1; assert ctypes.pythonapi._PyJac_CompilerBridgeVersion() == 4'
          WORK="$(mktemp -d)"
          printf 'obj P { has x:int=0; def sq->int { return self.x*self.x; } }\nwith entry { print(P(x=7).sq()); }\n' > "$WORK/obj.jac"
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" --version
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" -c 'import os, ssl; assert os.path.isfile(os.environ["SSL_CERT_FILE"]); assert ssl.create_default_context().cert_store_stats()["x509_ca"] > 0'
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/obj.jac")"
          grep -q 49 <<<"$out"

      - name: Run real jac programs (end-to-end execution)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"; cd "$WORK"
          cat > a.jac <<'JAC'
          obj Point { has x: int; has y: int; def dist -> float { return (self.x*self.x + self.y*self.y) ** 0.5; } }
          with entry {
              p = Point(x=3, y=4);
              print("dist", p.dist());
              print([i*i for i in range(5)]);
          }
          JAC
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/a.jac")"
          grep -q "dist 5.0" <<<"$out"
          grep -q "0, 1, 4, 9, 16" <<<"$out"

      - name: jac test runner (self-contained test file)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"
          cat > "$WORK/test_smoke.jac" <<'JAC'
          test "arithmetic" { assert 6 * 7 == 42; }
          test "comprehension" { assert [i for i in range(3)] == [0, 1, 2]; }
          test "strings" { assert "ja" + "c" == "jac"; }
          JAC
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_TEST_JOBS=0 JAC_NO_DEV_SOURCE=1 "$BIN" test "$WORK/test_smoke.jac"

      # if-no-files-found only fires when NO path matches, so a single missing
      # tree ships a quietly incomplete kit to every consumer. Assert each one.
      - name: Verify the kit is complete
        working-directory: jac
        run: |
          set -euo pipefail
          for p in zig-out/bin/jac jaclang/vendor/typeshed/stdlib \
                   .pbs-build/linux-x86_64/musl/lib \
                   .pbs-build/linux-aarch64/musl/lib \
                   .pbs-build/wasm32/libc; do
            [ -e "$p" ] || { echo "::error::kit is missing $p"; exit 1; }
          done

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: jac-kit
          path: |
            jac/zig-out/bin/jac
            jac/jaclang/vendor/typeshed/stdlib
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # The one precompile of this code version. Either `zig build` just
      # produced it (binary-cache miss) or it was restored in lockstep with the
      # binary it belongs to -- setup-jac keys the two together for exactly this
      # reason. Every reroute lane runs against this tree under
      # JAC_PRECOMPILE_REQUIRED=1 and recompiles nothing.
      - name: Verify the precompile bundle is complete
        working-directory: jac
        run: |
          set -euo pipefail
          DIR="$(find .precompiled-build/jacpython -maxdepth 1 -type d -name 'cpython-*' | head -1)"
          [ -n "$DIR" ] || { echo "::error::no .precompiled-build/jacpython/cpython-<ver> tree"; exit 1; }
          [ -f .precompiled-build/jacpython/MANIFEST.json ] || {
            echo "::error::precompile tree has no MANIFEST.json, so the seal did not finish"; exit 1; }
          UNITS="$(find "$DIR" -name '*.jir' | wc -l | tr -d ' ')"
          [ "$UNITS" -ge 400 ] || { echo "::error::precompile tree has only $UNITS units"; exit 1; }
          echo "precompile bundle: $UNITS units in $DIR"

      - name: Upload the precompile bundle
        uses: actions/upload-artifact@v4
        with:
          name: jac-precompiled
          path: jac/.precompiled-build/jacpython
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  jac-check:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Reroute lane: see the jac check step below.
      JAC_NO_DEV_SOURCE: ""
      # Leave memory for the driver and self-hosted compiler on the 16 GB runner.
      JAC_CHECK_JOBS: "2"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # On PRs, scope fmt to .jac files changed vs the merge-base. `jac check`
      # is deliberately NOT scoped: a type error is a property of the whole
      # program, so a scoped run answers a different question than the push
      # sweep and a green PR stops predicting a green main.
      - name: Determine changed .jac files
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' > changed-jac.txt || true
          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          if [ -s changed-jac.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          cat changed-jac.txt || true

      # The analysis cache is content+env keyed (every entry folds the
      # compiler-source digest), so restoring any prior cache is safe by
      # construction: entries from another compiler generation simply miss
      # and get swept. The key's digest segment covers the compiler digest
      # roots, so a compiler edit starts cold exactly when it must, while
      # app-and-test-only PRs restore a fully warm analysis cache and the
      # whole-repo sweep collapses to diagnostics replay. Restored before
      # jac-kit (which pins XDG_CACHE_HOME to this path) so the kit's own
      # warm-up precompile re-wraps cached JIRs instead of compiling.
      #
      # The path is the whole jac cache, not jac/jir: this lane runs the
      # reroute (the checkout's compiler), and a rerouted compiler keeps
      # every JIR it writes -- its own precompiled modules and the sweep's
      # analysis entries -- under jac/rt/<generation>/. Caching jac/jir alone
      # saved ~7 MB and restored nothing. There is no digest-agnostic
      # fallback key: a generation directory from another compiler digest
      # is dead weight to restore.
      # Retries must be able to rule out a stale analysis/runtime cache.
      - name: Restore JIR analysis cache
        if: github.run_attempt == 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.cache/jac
          key: jac-check-cache-v3-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-${{ github.sha }}
          restore-keys: |
            jac-check-cache-v3-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-

      - uses: ./.github/actions/jac-kit

      - name: Install plugin deps so jac check resolves scale/byllm imports
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" \
            "firebase-admin>=6.0.0,<8.0.0" "requests>=2.32.0,<3.0.0" \
            --global
          jac install \
            "litellm>=1.102.1,<1.103.0" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global

      - name: Run jac fmt (check formatting)
        id: fmt
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping format check."
              exit 0
            fi
            FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
            if [ -z "$FILES" ]; then
              echo "No formattable .jac files changed (all excluded); skipping."
              exit 0
            fi
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          else
            git ls-files -z '*.jac' | grep -zv -E '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|_syntax_err\.jac$)' | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          fi

      # Autofix push mirrors pre-commit.ci. Without a JAC_AUTOFIX_TOKEN secret
      # the pushed commit does not retrigger CI (GitHub loop protection).
      - name: Push jac fmt autofix to the PR branch
        if: |
          steps.fmt.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTOFIX_TOKEN: ${{ secrets.JAC_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$HEAD_REF"
          if git log -1 --format=%s FETCH_HEAD | grep -q '^style: jac fmt autofix'; then
            echo "::warning::Head commit is already an autofix commit but the check still failed; not pushing again."
            exit 0
          fi
          git checkout -B "$HEAD_REF" FETCH_HEAD
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
          if [ -z "$FILES" ]; then
            echo "No formattable .jac files to fix."
            exit 0
          fi
          printf '%s\n' "$FILES" | tr '\n' '\0' \
            | xargs -0 --no-run-if-empty jac fmt --lintfix || true
          if git diff --quiet; then
            echo "Fixer produced no changes on the head branch; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: jac fmt autofix"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed jac fmt autofix to $HEAD_REF; the new commit's CI run supersedes this one."

      # Fork PRs cannot receive autofix pushes; print the patch so the author
      # can apply it locally.
      - name: Show formatting diff
        if: steps.fmt.outcome == 'failure'
        run: |
          set -euo pipefail
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --lintfix || true
            git --no-pager diff
          fi

      - name: Fail if formatting was not clean
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::jac fmt --check --lintfix failed for this commit (an autofix was pushed to the branch if this is a same-repo PR; fork PRs: apply the 'Show formatting diff' patch above)."
          exit 1

      # Manifest freshness, the seed-manifest bootstrap invariants, and the
      # CLI startup regressions all live in the suite now
      # (tests/cli/test_manifest_parity.jac, tests/compiler/
      # test_seed_manifest_bootstrap.jac, tests/cli/test_*_isolation.jac),
      # which test-compiler / test-runtime run on the same filter as this job.

      # The targets ARE jaclang's source, and jaclang.* belongs to the running
      # compiler: checked sealed, a checkout module's `import from
      # jaclang.x` resolves into the kit's bundled copy, and one class gets two
      # identities ("Cannot assign ServingApp to parameter of type
      # ServingApp"). Check the tree with its own compiler instead: the job
      # clears JAC_NO_DEV_SOURCE ("" engages the reroute, as the equivalence
      # chunk does).
      - name: Run jac check (exclusions from jac.toml [check] exclude)
        run: jac check . --nowarn

      - name: Save JIR analysis cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.cache/jac
          key: jac-check-cache-v3-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-${{ github.sha }}

      - name: Error-code breakdown (label "type-error-report")
        if: contains(github.event.pull_request.labels.*.name, 'type-error-report')
        run: |
          set +e
          jac check . --nowarn > jac-check-full.log 2>&1
          {
            echo "## jac check error-code breakdown (whole codebase, no ignores)"
            echo ""
            echo "| Error code | Count |"
            echo "| --- | ---: |"
            grep -oE 'error\[E[0-9]+\]' jac-check-full.log \
              | grep -oE 'E[0-9]+' \
              | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | %d |\n", $2, $1; total += $1 }
                     END { printf "| **TOTAL** | **%d** |\n", total }'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Pure PR-metadata policy: no kit, no jac. Docs code blocks are validated
  # by the suite (tests/cli/test_docs_code_blocks.jac) in the test lanes.
  contribution-checks:
    name: Contribution Checks
    needs: changes
    if: ${{ github.event_name != 'push' || needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Block AI co-author attribution
        if: github.event_name == 'pull_request'
        run: |
          if git log origin/${{ github.base_ref }}..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author attribution found in commit messages. Please remove Co-Authored-By lines referencing AI tools."
            exit 1
          fi

      - name: Block Python files
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-no-python-check')
        run: |
          if git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD \
            | grep -P '\.py$'; then
            echo "::error::New Python (.py) files detected in this PR. This codebase does not allow adding Python files."
            echo "To skip this check, add the 'skip-no-python-check' label to your PR."
            exit 1
          fi

      # Only main saves the stage-0 snapshot and kernel-units caches
      # (build-kit), so a PR that moves the pin builds its kernel from a cold
      # stage 0 on every push. A pin-only PR lands first and main warms the
      # caches before anything builds on it (stage0-bump.yml opens those).
      # Diffed from the PR's merge base, so a pin bump that landed on main
      # after this branch forked is not this PR's change.
      - name: Keep stage-0 pin bumps in their own PR
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-stage0-pin-check')
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pin=jac/bootstrap/stage0.json
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          changed=$(git diff --name-only --no-renames "$base" "$HEAD_SHA")
          grep -qxF "$pin" <<<"$changed" || exit 0
          others=$(grep -vxF "$pin" <<<"$changed" || true)
          [ -z "$others" ] && exit 0
          echo "::error file=$pin::This PR changes $pin together with $(grep -c . <<<"$others") other file(s). Bump the stage-0 pin in a PR that changes only $pin and merge it first: only runs on main save the stage-0 snapshot and kernel-units caches, so until the new pin lands on its own every push here builds the kernel from a cold stage 0 (slow, and it can run build-kit out of memory). Then rebase this PR onto main. The Stage-0 pin bump workflow (Actions tab, Run workflow, optionally naming a commit) opens such a PR."
          echo "To skip this check, add the 'skip-stage0-pin-check' label to your PR."
          echo "Other files changed since the merge base ($base):"
          head -n 50 <<<"$others"
          exit 1

      - name: Block duplicate diagnostic codes
        # Two branches each take the next free code and the merge keeps both;
        # the registry refuses at import, which here means the kit fails to
        # build. Reading the source names the collision in seconds instead.
        # Mirrors tests/compiler/test_diagnostic_registry.jac.
        run: |
          dupes=$(grep -Pzo '\b[EW]\d{4} = _(?:err|warn)\(\s*"\K[EW]\d{4}' \
            jac/jaclang/compiler/frontend/diagnostics.jac | tr '\0' '\n' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::diagnostic code(s) claimed more than once in diagnostics.jac: $(echo $dupes)"
            exit 1
          fi

      - name: Check Release Notes Updated
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-release-notes-check')
        env:
          CI: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-release-notes.sh

  gdb-slice:
    needs: build-kit
    runs-on: ubuntu-latest
    env:
      JAC_NO_DEV_SOURCE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jac-kit
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          use-cache: false
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Run tuple-slices under gdb
        working-directory: jac
        run: |
          set -x
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=1 gdb -batch \
            -ex 'set pagination off' \
            -ex 'set follow-fork-mode child' \
            -ex 'set detach-on-fork off' \
            -ex run \
            -ex 'thread apply all bt 30' \
            -ex 'info registers rip rdi rsi rdx rcx' \
            --args jac test tests/compiler/backends/native/test_native_tuple_slices.jac || true
