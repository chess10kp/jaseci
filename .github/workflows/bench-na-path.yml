name: bench-na-path

# Ad-hoc verification for the na-path stdlib batch (glob, pathlib, fnmatch,
# tempfile, filecmp, fileinput, linecache): builds the jac binary from this
# checkout, runs the prim_* equivalence fixtures for the new modules, then
# runs the three-lane bench (native / sv bridge / CPython oracle) plus the
# FFI-floor lane. Dispatch only -- not part of PR CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Materialize vendored runtimes
        working-directory: jac
        run: |
          set -euxo pipefail
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Prim equivalence tests (na-path modules)
        working-directory: jac
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          "$BIN" test jaclang/compiler/tests/test_prim_equivalence.jac \
            -f "glob bundled or pathlib bundled or fnmatch bundled or tempfile bundled or filecmp bundled or fileinput bundled or linecache bundled or bundled shutil" \
            2>&1 | tee prim.txt

      - name: Upload prim output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prim-na-path
          path: jac/prim.txt
          if-no-files-found: warn

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Materialize vendored runtimes
        working-directory: jac
        run: |
          set -euxo pipefail
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Bench -- native lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path.jac -- jac run -b native (${{ runner.os }} / ${{ runner.arch }}, $(nproc) vcpu)"
            echo '```'
            "$PWD/zig-out/bin/jac" run -b native ../scripts/bench_na_path.jac
            echo '```'
          } | tee bench_native.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- sv bridge lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path.jac -- jac run -b python (${{ runner.os }} / ${{ runner.arch }})"
            echo '```'
            "$PWD/zig-out/bin/jac" run -b python ../scripts/bench_na_path.jac
            echo '```'
          } | tee bench_sv.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- CPython oracle
        working-directory: jac
        run: |
          set -euo pipefail
          PY="$(command -v python3 || true)"
          if [ -z "$PY" ] && [ -x .python-build/jacpython/bin/python3 ]; then
            PY=.python-build/jacpython/bin/python3
          fi
          {
            echo "### bench_na_path.py -- python3 (${{ runner.os }} / ${{ runner.arch }})"
            echo '```'
            "$PY" ../scripts/bench_na_path.py
            echo '```'
          } | tee bench_py.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- FFI floor lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path_ffi.jac -- jac run -b native (floor only)"
            echo '```'
            "$PWD/zig-out/bin/jac" run -b native ../scripts/bench_na_path_ffi.jac
            echo '```'
          } | tee bench_ffi.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-na-path
          path: |
            jac/bench_native.txt
            jac/bench_sv.txt
            jac/bench_py.txt
            jac/bench_ffi.txt
          if-no-files-found: warn
