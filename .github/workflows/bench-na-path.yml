name: bench-na-path

# Ad-hoc verification for the na-path stdlib batch (glob, pathlib, fnmatch,
# tempfile, filecmp, fileinput, linecache): builds the jac binary from this
# checkout, runs the prim_* equivalence fixtures for the new modules, then
# runs the three-lane bench (native / sv bridge / CPython oracle) plus the
# FFI-floor lane. Dispatch only -- not part of PR CI.
#
# JAC_NO_DEV_SOURCE=1 keeps every `jac` invocation on the embedded compiler
# (built from this same checkout during "Build the jac binary"), skipping
# the dev-mode self-host bootstrap that otherwise recompiles jaclang --
# including na_ir_gen_pass.jac, ~50 min alone -- inside each step.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAC_NO_DEV_SOURCE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Materialize vendored runtimes
        working-directory: jac
        run: |
          set -euxo pipefail
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Prim equivalence tests (na-path modules)
        working-directory: jac
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          for case in "glob bundled" "pathlib bundled" "fnmatch bundled" \
              "tempfile bundled" "filecmp bundled" "fileinput bundled" \
              "linecache bundled" "bundled shutil"; do
            echo "=== case: $case"
            "$BIN" test jaclang/compiler/tests/test_prim_equivalence.jac \
              -f "$case" 2>&1 | tee -a prim.txt
          done

      - name: Upload prim output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prim-na-path
          path: jac/prim.txt
          if-no-files-found: warn

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"

      - name: Materialize vendored runtimes
        working-directory: jac
        run: |
          set -euxo pipefail
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all

      - name: Build the bench binary (native)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          "$BIN" build --native ../scripts/bench_na_path.jac \
            -o "$PWD/bench_na_path" --jit-jobs 0
          "$BIN" build --native ../scripts/bench_na_path_ffi.jac \
            -o "$PWD/bench_na_path_ffi" --jit-jobs 0

      - name: Bench -- native lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path.jac -- native binary (${{ runner.os }} / ${{ runner.arch }}, $(nproc) vcpu)"
            echo '```'
            ./bench_na_path
            echo '```'
          } | tee bench_native.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- FFI floor lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path_ffi.jac -- native binary (floor only)"
            echo '```'
            ./bench_na_path_ffi
            echo '```'
          } | tee bench_ffi.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- sv bridge lane
        working-directory: jac
        run: |
          set -euo pipefail
          {
            echo "### bench_na_path.jac -- jac run -b python (${{ runner.os }} / ${{ runner.arch }})"
            echo '```'
            "$PWD/zig-out/bin/jac" run -b python ../scripts/bench_na_path.jac
            echo '```'
          } | tee bench_sv.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bench -- CPython oracle
        working-directory: jac
        run: |
          set -euo pipefail
          PY="$(command -v python3 || true)"
          if [ -z "$PY" ] && [ -x .python-build/jacpython/bin/python3 ]; then
            PY=.python-build/jacpython/bin/python3
          fi
          {
            echo "### bench_na_path.py -- python3 (${{ runner.os }} / ${{ runner.arch }})"
            echo '```'
            "$PY" ../scripts/bench_na_path.py
            echo '```'
          } | tee bench_py.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-na-path
          path: |
            jac/bench_native.txt
            jac/bench_sv.txt
            jac/bench_py.txt
            jac/bench_ffi.txt
          if-no-files-found: warn
